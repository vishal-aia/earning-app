<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnPro - Mobile Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .nav-active { color: #4f46e5; border-top: 3px solid #4f46e5; }
        .checkin-day { aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="pb-20">

    <!-- Top Wallet Section -->
    <div class="bg-indigo-700 text-white p-6 rounded-b-[2.5rem] shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-black italic">EARNPRO</h1>
            <i class="fa-solid fa-bell opacity-70 text-lg"></i>
        </div>
        <p class="text-indigo-200 text-sm">Total Balance</p>
        <div class="flex items-end gap-2">
            <h2 class="text-4xl font-bold">₹<span id="balance">0.00</span></h2>
            <span class="bg-indigo-500 text-[10px] px-2 py-1 rounded-full mb-1">SAFE</span>
        </div>
    </div>

    <main class="p-4">
        <!-- 7-Day Check-in Grid -->
        <div class="bg-white p-4 rounded-3xl shadow-sm mb-6">
            <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-calendar-check text-orange-500"></i> Daily Bonus
            </h3>
            <div class="grid grid-cols-7 gap-2" id="checkin-grid">
                <!-- Days will be generated by JS -->
            </div>
            <button onclick="claimCheckIn()" id="checkin-btn" class="w-full mt-4 bg-orange-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-orange-200">CLAIM TODAY</button>
        </div>

        <!-- Spin Wheel Placeholder -->
        <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-6 rounded-3xl text-white mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <h3 class="text-lg font-bold">Lucky Spin Wheel</h3>
                <p class="text-xs opacity-80">Win up to ₹100 Daily</p>
                <button class="mt-4 bg-white text-blue-600 px-6 py-2 rounded-full font-bold text-sm">SPIN NOW</button>
            </div>
            <span class="absolute -right-4 -bottom-4 text-7xl opacity-20 rotate-12">🎡</span>
        </div>

        <!-- Tasks Section -->
        <div class="space-y-4">
            <h3 class="font-bold text-gray-800 ml-2">Premium Tasks</h3>
            
            <div onclick="startTask()" class="bg-white p-4 rounded-2xl flex items-center justify-between border border-gray-100 shadow-sm cursor-pointer hover:bg-gray-50">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-100 p-3 rounded-xl"><i class="fa-solid fa-video text-blue-600"></i></div>
                    <div>
                        <p class="font-bold text-sm text-gray-800">Watch Ad Video</p>
                        <p class="text-[10px] text-gray-400">Timer: 30s | Reward: ₹0.50</p>
                    </div>
                </div>
                <div id="task-timer" class="text-xs font-bold text-indigo-600">START</div>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 shadow-2xl">
        <button class="nav-active flex flex-col items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-house text-lg"></i>Home</button>
        <button class="text-gray-400 flex flex-col items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-users text-lg"></i>Invite</button>
        <button class="text-gray-400 flex flex-col items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-wallet text-lg"></i>Wallet</button>
    </div>

    <script>
        let backendUrl = "https://earn-hub-z1su.onrender.com";
        let userId = "USER_ID_STORAGE"; // In real app, this comes from login

        // Generate 7 Day Grid
        const grid = document.getElementById('checkin-grid');
        for(let i=1; i<=7; i++) {
            grid.innerHTML += `<div class="checkin-day bg-gray-100 text-gray-400 border border-gray-200">
                <span>Day ${i}</span>
                <span class="text-[12px]">₹${i*2}</span>
            </div>`;
        }

        async function startTask() {
            document.getElementById('task-timer').innerText = "30s...";
            await fetch(`${backendUrl}/api/earn/start-task`, { method: 'POST', body: JSON.stringify({userId}) });
            
            // Open Ad Link in new tab
            window.open("YOUR_AD_LINK", "_blank");

            let seconds = 30;
            let timer = setInterval(() => {
                seconds--;
                document.getElementById('task-timer').innerText = seconds + "s";
                if(seconds <= 0) {
                    clearInterval(timer);
                    document.getElementById('task-timer').innerText = "CLAIM";
                    document.getElementById('task-timer').onclick = claimTask;
                }
            }, 1000);
        }

        async function claimTask() {
            const res = await fetch(`${backendUrl}/api/earn/claim-task`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId}) 
            });
            const data = await res.json();
            if(res.ok) {
                alert(data.msg);
                document.getElementById('balance').innerText = data.balance.toFixed(2);
            } else {
                alert(data.msg);
            }
        }
    </script>
</body>
</html>
