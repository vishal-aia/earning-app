<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnPro Max - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tab-btn.active { color: #4f46e5; border-bottom: 3px solid #4f46e5; }
    </style>
</head>
<body class="bg-slate-100 font-sans pb-24">

    <!-- Header -->
    <div class="bg-indigo-600 p-6 rounded-b-[3rem] shadow-2xl text-white">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-black italic">EARNPRO<span class="text-yellow-400">MAX</span></h1>
            <button onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
        </div>
        <div class="mt-8 text-center bg-white/10 p-4 rounded-3xl border border-white/20">
            <p class="text-xs opacity-70">Main Wallet</p>
            <h2 class="text-4xl font-extrabold">₹<span id="bal">0.00</span></h2>
        </div>
    </div>

    <!-- 7-Day Grid -->
    <div class="p-4 mt-[-20px]">
        <div class="bg-white p-5 rounded-[2rem] shadow-xl">
            <h3 class="font-bold mb-4 text-gray-800 tracking-tight text-sm"><i class="fa-solid fa-gift text-orange-500 mr-2"></i> 7-Day Login Streak</h3>
            <div class="grid grid-cols-7 gap-2" id="grid"></div>
            <button onclick="claimCheckin()" class="w-full mt-4 bg-orange-500 text-white py-4 rounded-2xl font-black shadow-lg shadow-orange-200 uppercase text-xs tracking-widest active:scale-95 transition-all">Claim Today</button>
        </div>
    </div>

    <!-- Spin & Tasks -->
    <div class="p-4 space-y-4">
        <div onclick="startTask()" class="bg-white p-5 rounded-[2rem] shadow-lg flex justify-between items-center border border-gray-100 cursor-pointer">
            <div class="flex items-center gap-4">
                <div class="bg-blue-100 p-4 rounded-2xl text-blue-600"><i class="fa-solid fa-video text-xl"></i></div>
                <div>
                    <h4 class="font-bold text-gray-800">Watch Premium Ad</h4>
                    <p class="text-[10px] text-gray-400 uppercase" id="t-status">Reward: ₹0.50 | 30s</p>
                </div>
            </div>
            <div id="t-btn" class="text-indigo-600 font-black text-xs">START</div>
        </div>

        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-6 rounded-[2rem] text-white flex justify-between items-center">
            <div>
                <h4 class="font-bold">Lucky Spin</h4>
                <p class="text-[10px] opacity-80">Test your luck daily</p>
            </div>
            <button class="bg-white text-indigo-600 px-6 py-2 rounded-full font-black text-xs shadow-lg">SPIN</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 w-full bg-white border-t p-4 flex justify-around rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
        <button class="tab-btn active flex flex-col items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-house-chimney text-xl"></i>Home</button>
        <button onclick="showSection('withdraw')" class="tab-btn text-gray-400 flex flex-col items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-wallet text-xl"></i>Withdraw</button>
        <button class="tab-btn text-gray-400 flex flex-col items-center gap-1 text-[10px] font-bold"><i class="fa-solid fa-users text-xl"></i>Refer</button>
    </nav>

    <script>
        // 🛑 RENDER URL
        const backendUrl = "https://earn-hub-z1su.onrender.com"; 
        let userId = localStorage.getItem('userId') || "temp_id";

        async function init() {
            const res = await fetch(`${backendUrl}/api/settings`);
            const data = await res.json();
            window.adLink = data.adLink;
            // Generate Grid
            const grid = document.getElementById('grid');
            data.checkInRewards.forEach((r, i) => {
                grid.innerHTML += `<div class="aspect-square bg-slate-50 border rounded-xl flex flex-col items-center justify-center text-[8px] font-bold">
                    <span class="text-gray-400">Day ${i+1}</span>
                    <span class="text-indigo-600 text-xs">₹${r}</span>
                </div>`;
            });
        }

        async function startTask() {
            await fetch(`${backendUrl}/api/earn/start`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({userId}) });
            window.open(window.adLink, '_blank');
            let time = 30;
            const btn = document.getElementById('t-btn');
            const timer = setInterval(() => {
                time--;
                btn.innerText = time + "S";
                if(time <= 0) {
                    clearInterval(timer);
                    btn.innerText = "CLAIM";
                    btn.onclick = claimTask;
                }
            }, 1000);
        }

        async function claimTask() {
            const res = await fetch(`${backendUrl}/api/earn/claim`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId}) });
            const data = await res.json();
            if(res.ok) alert("₹0.50 Added!");
            location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
