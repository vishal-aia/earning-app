<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SikkaPro | Daily Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; }
        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .task-card { background: #1e293b; border-radius: 20px; border: 1px solid #334155; }
        .streak-dot { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid #334155; position: relative; }
        .streak-dot.completed { background: #facc15; border-color: #facc15; color: #000; }
        .streak-line { flex-grow: 1; height: 2px; background: #334155; }
        .streak-line.completed { background: #facc15; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative shadow-2xl bg-slate-950">

    <!-- Auth Screen -->
    <div id="authPage" class="screen p-8 pt-20 active">
        <h1 class="text-4xl font-black text-yellow-400 mb-2 italic uppercase">Earning<span class="text-white">Hub</span></h1>
        <p class="text-slate-400 text-sm mb-10 uppercase tracking-widest">Digital Earning Platform</p>
        <div id="loginForm" class="space-y-4">
            <input id="lEmail" type="email" placeholder="Email Address" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-yellow-400">
            <input id="lPass" type="password" placeholder="Password" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-yellow-400">
            <button onclick="login()" class="w-full bg-yellow-400 text-black font-black py-4 rounded-2xl shadow-xl shadow-yellow-400/10">LOGIN</button>
            <p class="text-center text-xs">Naye hain? <span onclick="toggleAuth()" class="text-yellow-400 font-bold cursor-pointer">Account Banayein</span></p>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="homePage" class="screen">
        <header class="p-6 flex justify-between items-center sticky top-0 bg-slate-950/80 backdrop-blur-md z-50">
            <h2 class="text-xl font-black italic">Earning hub</h2>
            <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-2xl flex items-center gap-2">
                <i class="fa-solid fa-coins text-yellow-400"></i>
                <span id="bal" class="font-bold">0.00</span>
            </div>
        </header>

        <main class="p-4 space-y-6">
            <!-- Microsoft Rewards Style Streak -->
            <div class="task-card p-5">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-sm">Check-in Streak</h3>
                    <span class="text-[10px] text-yellow-400 font-bold uppercase tracking-tighter">Day <span id="streakNum">1</span>/7</span>
                </div>
                <div class="flex items-center justify-between px-2" id="streakVisual">
                    <!-- Dots will be generated here -->
                </div>
                <button onclick="claimCheckin()" class="w-full mt-6 bg-yellow-400 text-black py-3 rounded-xl font-black text-xs uppercase shadow-lg shadow-yellow-400/20">Claim Today's Reward</button>
            </div>

            <!-- Extra Earning Section -->
            <div onclick="showPage('videoPage')" class="bg-gradient-to-r from-yellow-400 to-orange-500 p-6 rounded-3xl text-black flex justify-between items-center cursor-pointer shadow-lg active:scale-95 transition-all">
                <div>
                    <h3 class="font-black text-lg italic uppercase">Extra Earning</h3>
                    <p class="text-[10px] font-bold opacity-80 uppercase">Watch Videos & Smartlinks</p>
                </div>
                <i class="fa-solid fa-circle-play text-3xl"></i>
            </div>

            <!-- CPA Tasks -->
            <h3 class="font-black text-gray-400 text-xs uppercase ml-2 tracking-widest">Offers & Apps</h3>
            <div id="cpaTasks" class="space-y-3">
                <!-- Task Cards will load from Admin -->
            </div>
        </main>
    </div>

    <!-- Navigation -->
    <nav id="nav" class="fixed bottom-0 max-w-md w-full bg-slate-900/90 border-t border-slate-800 p-4 flex justify-around rounded-t-[2.5rem] hidden">
        <button onclick="showPage('homePage')" class="text-yellow-400 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-house-chimney text-xl"></i>Home</button>
        <button onclick="showPage('walletPage')" class="text-slate-500 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-wallet text-xl"></i>Wallet</button>
        <button onclick="showPage('referPage')" class="text-slate-500 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-users text-xl"></i>Refer</button>
    </nav>

    <script>
        const backendUrl = "https://earn-hub-z1su.onrender.com"; 
        
        async function loadStreak(streak) {
            const container = document.getElementById('streakVisual');
            container.innerHTML = "";
            for(let i=1; i<=7; i++) {
                const active = i <= streak ? "completed" : "";
                container.innerHTML += `<div class="streak-dot ${active}">${i < streak ? '✓' : i}</div>`;
                if(i < 7) container.innerHTML += `<div class="streak-line ${i < streak ? 'completed' : ''}"></div>`;
            }
        }

        async function login() {
            const email = document.getElementById('lEmail').value;
            const password = document.getElementById('lPass').value;
            const res = await fetch(`${backendUrl}/api/auth/login`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({email, password})
            });
            const d = await res.json();
            if(res.ok) {
                localStorage.setItem('userId', d.userId);
                location.reload();
            } else { alert(d.msg); }
        }

        window.onload = () => {
            if(localStorage.getItem('userId')) {
                document.getElementById('authPage').classList.remove('active');
                document.getElementById('homePage').classList.add('active');
                document.getElementById('nav').classList.remove('hidden');
                loadStreak(1); // Default
            }
        }
    </script>
</body>
</html>
