<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnMaster Pro | Real Cash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .page { display: none; }
        .page-active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glass-header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative">

    <!-- TOP FIXED HEADER -->
    <header class="glass-header p-6 text-white flex justify-between items-center sticky top-0 z-50 rounded-b-3xl shadow-lg">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter">EARNMASTER</h1>
        </div>
        <div class="bg-white/20 px-4 py-2 rounded-2xl backdrop-blur-md border border-white/30 flex items-center gap-2">
            <span class="text-[10px] font-bold uppercase opacity-80">Wallet</span>
            <span class="font-black text-lg">₹<span id="topBal">0.00</span></span>
        </div>
    </header>

    <!-- 1. HOME PAGE (Tasks) -->
    <main id="homePage" class="page page-active p-5 space-y-6">
        <!-- Daily Streak Placeholder -->
        <div class="bg-white p-4 rounded-3xl border shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="text-2xl">🎁</div>
                <p class="font-bold text-sm">Daily Bonus</p>
            </div>
            <button onclick="claimBonus()" class="bg-indigo-600 text-white text-[10px] px-4 py-2 rounded-xl font-bold">CLAIM</button>
        </div>

        <!-- SECTION 1: VIDEO ADS (With Timer) -->
        <h3 class="font-black text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-play text-red-500"></i> VIDEO AD TASKS (30s Cooldown)</h3>
        <div id="adTasks" class="space-y-3">
            <!-- Dynamic Content -->
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 flex justify-between items-center">
                <div>
                    <p class="font-bold text-sm">Watch Ad #1</p>
                    <p class="text-[10px] text-gray-400">Reward: ₹0.50</p>
                </div>
                <button onclick="startAdTask(this, 'TASK_ID')" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold">WATCH AD</button>
            </div>
        </div>

        <!-- SECTION 2: CPA OFFERS (Direct) -->
        <h3 class="font-black text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-download text-green-500"></i> APP INSTALL / CPA OFFERS</h3>
        <div id="cpaTasks" class="space-y-3">
            <div class="bg-green-50 p-4 rounded-2xl border border-green-100 flex justify-between items-center">
                <div>
                    <p class="font-bold text-sm">Register on App</p>
                    <p class="text-[10px] text-gray-400">Reward: ₹10.00</p>
                </div>
                <button onclick="startCpaTask('LINK')" class="bg-green-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold">INSTALL</button>
            </div>
        </div>
    </main>

    <!-- 2. WALLET PAGE -->
    <main id="walletPage" class="page p-6">
        <h2 class="text-3xl font-black text-gray-800 mb-6">Mera Wallet</h2>
        <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl mb-8">
            <p class="text-xs opacity-50 uppercase font-bold tracking-widest">Available to Withdraw</p>
            <h3 class="text-5xl font-black mt-2">₹<span id="wallBal">0.00</span></h3>
        </div>

        <div class="space-y-4">
            <h4 class="font-bold text-gray-800">Withdrawal Request</h4>
            <input id="upiId" type="text" placeholder="UPI ID (example@ybl)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:border-indigo-600">
            <input id="amount" type="number" placeholder="Amount (Min ₹100)" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
            <button onclick="requestWithdraw()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100">WITHDRAW NOW</button>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white/90 backdrop-blur-md border-t p-4 flex justify-around rounded-t-[2.5rem] shadow-2xl z-[100]">
        <button onclick="switchTab('homePage')" class="flex flex-col items-center gap-1 font-bold text-[10px] text-indigo-600"><i class="fa-solid fa-house-chimney text-xl"></i>Home</button>
        <button onclick="switchTab('walletPage')" class="flex flex-col items-center gap-1 font-bold text-[10px] text-gray-400"><i class="fa-solid fa-wallet text-xl"></i>Wallet</button>
        <button onclick="alert('Join Telegram for Updates!')" class="flex flex-col items-center gap-1 font-bold text-[10px] text-gray-400"><i class="fa-solid fa-circle-info text-xl"></i>Info</button>
    </nav>

    <script>
        const backendUrl = "https://earn-hub-z1su.onrender.com"; 

        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('page-active'));
            document.getElementById(id).classList.add('page-active');
        }

        // --- AD TASK WITH 30S COOLDOWN ---
        function startAdTask(btn, taskId) {
            window.open("YOUR_SMARTLINK_HERE", "_blank");
            btn.disabled = true;
            btn.innerText = "WAIT 30S";
            btn.classList.replace('bg-indigo-600', 'bg-gray-400');

            let seconds = 30;
            const timer = setInterval(() => {
                seconds--;
                btn.innerText = `WAIT ${seconds}S`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    btn.innerText = "CLAIM REWARD";
                    btn.classList.replace('bg-gray-400', 'bg-green-600');
                    btn.onclick = () => claimReward(taskId);
                }
            }, 1000);
        }

        async function claimReward(taskId) {
            // Backend API call to add money
            alert("Reward Claimed! Check Balance.");
            location.reload();
        }

        async function startCpaTask(link) {
            window.open(link, "_blank");
            alert("Install karne ke baad wapas aayein claim karne.");
        }
    </script>
</body>
</html>
