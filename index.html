<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EarningHub - Login & Earn</title>
    
    <!-- SEO Tags -->
    <meta name="description" content="EarningHub: Complete surveys, tasks and earn daily money. Withdraw via UPI/Paytm.">
    <meta name="keywords" content="earning app, make money online, paytm cash, upi withdrawal">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0A0E17; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-btn { background: linear-gradient(90deg, #2563eb, #4f46e5); }
        .hidden-view { display: none; }
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); bottom: 30px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div id="toast">Message here...</div>

    <!-- 1. AUTH VIEW (Signup/Login) -->
    <section id="auth-view" class="min-h-screen flex flex-col justify-center p-6">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-blue-500 italic">EarningHub</h1>
            <p class="text-gray-400 mt-2">Login to start earning today</p>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="glass-card p-8 rounded-3xl space-y-4">
            <input type="email" id="login-email" placeholder="Email Address" class="w-full bg-slate-800 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            <input type="password" id="login-pass" placeholder="Password" class="w-full bg-slate-800 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            <button onclick="handleLogin()" class="w-full gradient-btn py-4 rounded-xl font-bold uppercase tracking-widest shadow-lg">Login</button>
            <p class="text-center text-sm text-gray-400">Don't have an account? <span onclick="toggleAuth()" class="text-blue-500 font-bold cursor-pointer">Register</span></p>
        </div>

        <!-- Signup Form (Hidden by default) -->
        <div id="signup-form" class="glass-card p-8 rounded-3xl space-y-4 hidden-view">
            <input type="text" id="reg-name" placeholder="Full Name" class="w-full bg-slate-800 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            <input type="email" id="reg-email" placeholder="Email Address" class="w-full bg-slate-800 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            <input type="password" id="reg-pass" placeholder="Create Password" class="w-full bg-slate-800 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            <button onclick="handleSignup()" class="w-full gradient-btn py-4 rounded-xl font-bold uppercase tracking-widest">Create Account</button>
            <p class="text-center text-sm text-gray-400">Already have an account? <span onclick="toggleAuth()" class="text-blue-500 font-bold cursor-pointer">Login</span></p>
        </div>
    </section>

    <!-- 2. MAIN DASHBOARD VIEW (Hidden until login) -->
    <section id="main-view" class="hidden-view pb-24">
        <!-- Top Nav -->
        <div class="p-5 flex justify-between items-center sticky top-0 bg-[#0A0E17] z-50">
            <h1 class="text-xl font-bold italic">Earning<span class="text-blue-500">Hub</span></h1>
            <div class="bg-blue-900/30 border border-blue-500/30 px-3 py-1 rounded-full text-yellow-400 font-bold">
                🪙 <span id="balance-display">0.00</span>
            </div>
        </div>

        <div class="p-4 space-y-6">
            <!-- Wallet -->
            <div class="glass-card p-6 rounded-[2rem] relative overflow-hidden">
                <p class="text-gray-400 text-sm">Main Balance</p>
                <h2 class="text-4xl font-bold">₹<span id="cash-display">0.00</span></h2>
                <button onclick="showWithdrawModal()" class="w-full mt-4 py-3 bg-blue-600 rounded-xl font-bold">WITHDRAW</button>
            </div>

            <!-- Daily Checkin -->
            <div class="glass-card p-5 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold">Daily Check-in</h3>
                    <span class="text-xs text-blue-400">7 Days Streak</span>
                </div>
                <div class="grid grid-cols-4 gap-2" id="checkin-grid">
                    <!-- Days will be loaded here -->
                </div>
            </div>

            <!-- Task List -->
            <div class="space-y-3">
                <h3 class="text-xs font-bold text-gray-500 uppercase">Available Tasks</h3>
                <div class="glass-card p-4 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-link text-blue-400 text-xl"></i>
                        <div><p class="font-bold text-sm">Smartlink Ad</p><p class="text-[10px] text-gray-400">Earn ₹0.50 per click</p></div>
                    </div>
                    <button class="bg-blue-600 px-4 py-1 rounded-lg text-xs">GO</button>
                </div>
            </div>
        </div>

        <!-- Bottom Menu -->
        <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 border-t border-white/10 h-16 flex justify-around items-center px-4">
            <div class="text-blue-500 flex flex-col items-center"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></div>
            <div onclick="showRefer()" class="text-gray-500 flex flex-col items-center"><i class="fas fa-users"></i><span class="text-[10px]">Refer</span></div>
            <div onclick="logoutUser()" class="text-gray-500 flex flex-col items-center"><i class="fas fa-sign-out-alt"></i><span class="text-[10px]">Logout</span></div>
        </nav>
    </section>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script>
        // Firebase Configuration (Replace with your actual keys from Firebase Console)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-view').classList.add('hidden-view');
                document.getElementById('main-view').classList.remove('hidden-view');
                loadUserData(user.uid);
            } else {
                document.getElementById('auth-view').classList.remove('hidden-view');
                document.getElementById('main-view').classList.add('hidden-view');
            }
        });

        // Toggle Signup/Login
        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden-view');
            document.getElementById('signup-form').classList.toggle('hidden-view');
        }

        // Signup Logic
        function handleSignup() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value;

            auth.createUserWithEmailAndPassword(email, pass)
                .then((cred) => {
                    return db.collection('users').doc(cred.user.uid).set({
                        name: name,
                        balance: 0,
                        referCode: Math.random().toString(36).substring(7).toUpperCase(),
                        lastCheckIn: null
                    });
                })
                .catch(err => alert(err.message));
        }

        // Login Logic
        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
        }

        // Logout
        function logoutUser() { auth.signOut(); }

        // Fetch User Data
        function loadUserData(uid) {
            db.collection('users').doc(uid).onSnapshot(doc => {
                const data = doc.data();
                document.getElementById('balance-display').innerText = data.balance.toFixed(2);
                document.getElementById('cash-display').innerText = data.balance.toFixed(2);
            });
        }
    </script>
</body>
</html>
