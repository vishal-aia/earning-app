<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnMaster Pro | Ghar Baithe Paise Kamayein</title>
    
    <!-- SEO TAGS -->
    <meta name="description" content="Bharat ka sabse trusted earning platform. Daily ads dekhein aur paise kamayein.">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .gradient-card { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        .btn-premium { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
    </style>
</head>
<body class="max-w-md mx-auto shadow-2xl min-h-screen pb-20">

    <!-- Header -->
    <header class="gradient-card p-6 text-white rounded-b-[2.5rem] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black tracking-tighter italic text-indigo-400">EARNMASTER</h1>
            <div class="bg-white/10 px-4 py-1 rounded-full text-xs border border-white/20">Active</div>
        </div>
        <div class="text-center">
            <p class="text-xs text-indigo-200 uppercase tracking-widest font-bold">Aapka Balance</p>
            <h2 class="text-5xl font-extrabold my-2">₹<span id="userBalance">0.00</span></h2>
            <div class="flex justify-center gap-4 mt-4">
                <button onclick="showPage('withdraw')" class="bg-indigo-500 px-6 py-2 rounded-xl text-sm font-bold shadow-lg">Withdraw</button>
                <button onclick="showPage('invite')" class="bg-white/10 px-6 py-2 rounded-xl text-sm font-bold">Invite</button>
            </div>
        </div>
    </header>

    <main id="content" class="p-4">
        <!-- Dashboard Section -->
        <div id="dashboard" class="space-y-6">
            <!-- 7-Day Streak -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-orange-500"></i> 7-Day Daily Streak
                </h3>
                <div class="grid grid-cols-7 gap-2" id="checkinGrid"></div>
                <button onclick="handleCheckIn()" class="w-full mt-4 btn-premium text-white py-4 rounded-2xl font-bold shadow-indigo-200 shadow-xl active:scale-95 transition-all">Claim Today's Bonus</button>
            </div>

            <!-- Task List -->
            <h3 class="font-bold text-gray-800 ml-2">High Paying Tasks</h3>
            <div id="taskList" class="space-y-4">
                <div onclick="startSmartlink()" class="bg-white p-4 rounded-2xl flex items-center justify-between border border-gray-100 shadow-sm cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="bg-indigo-100 p-4 rounded-2xl text-indigo-600 text-xl"><i class="fa-solid fa-bolt"></i></div>
                        <div>
                            <p class="font-bold text-gray-800">Premium Smartlink</p>
                            <p id="timerDisplay" class="text-[10px] text-gray-400 font-bold uppercase">Wait 30s | Get ₹0.50</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-300"></i>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t p-4 flex justify-around rounded-t-[2.5rem] shadow-2xl z-50">
        <button onclick="showPage('dashboard')" class="text-indigo-600 flex flex-col items-center text-[10px] font-bold"><i class="fa-solid fa-house-chimney text-xl"></i>Home</button>
        <button onclick="showPage('withdraw')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><i class="fa-solid fa-wallet text-xl"></i>Wallet</button>
        <button onclick="showPage('invite')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><i class="fa-solid fa-users text-xl"></i>Refer</button>
    </nav>

    <script>
        // 🛑 CONFIGURATION
        const backendUrl = "PASTE_YOUR_RENDER_URL_HERE"; 
        let userId = localStorage.getItem('userId') || "vashu_01";
        let adLink = "";

        async function init() {
            try {
                const res = await fetch(`${backendUrl}/api/settings`);
                const s = await res.json();
                adLink = s.adLink;
                // Generate Grid
                const grid = document.getElementById('checkinGrid');
                s.checkInReward.forEach((r, i) => {
                    grid.innerHTML += `<div class="aspect-square bg-slate-50 border rounded-2xl flex flex-col items-center justify-center text-[8px] font-bold">
                        <span class="text-gray-400">Day ${i+1}</span>
                        <span class="text-indigo-600 text-xs">₹${r}</span>
                    </div>`;
                });
            } catch (e) { console.log("System Syncing..."); }
        }

        function startSmartlink() {
            window.open(adLink, "_blank");
            let time = 30;
            const display = document.getElementById('timerDisplay');
            const interval = setInterval(() => {
                time--;
                display.innerText = `PLEASE WAIT: ${time}S`;
                if(time <= 0) {
                    clearInterval(interval);
                    display.innerText = "CLICK TO CLAIM REWARD";
                    display.parentElement.parentElement.onclick = claimReward;
                }
            }, 1000);
        }

        async function claimReward() {
            const res = await fetch(`${backendUrl}/api/tasks/claim`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, type: 'smartlink' })
            });
            const d = await res.json();
            if(res.ok) {
                alert("Success! Balance Added.");
                location.reload();
            } else { alert(d.msg); }
        }

        window.onload = init;
    </script>
</body>
</html>
