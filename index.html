<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnMaster Pro | Bharat's No.1 Platform</title>
    
    <!-- ADVANCED SEO -->
    <meta name="description" content="EarnMaster Pro par daily tasks poore karein aur real cash kamayein. Google Verified & Secure payouts.">
    <meta name="robots" content="index, follow">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #f0f4f8; }
        .premium-card { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); }
        .toast { transform: translateY(100px); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative overflow-hidden">

    <!-- Custom Toast (No more vercel.app alerts) -->
    <div id="customToast" class="toast fixed bottom-24 left-4 right-4 bg-gray-900 text-white p-4 rounded-2xl flex items-center gap-3 z-[999] shadow-2xl">
        <div id="toastIcon" class="bg-indigo-500 p-2 rounded-lg text-sm">✨</div>
        <p id="toastMsg" class="text-sm font-bold"></p>
    </div>

    <!-- UI Header -->
    <header class="premium-card p-8 text-white rounded-b-[3.5rem] shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-black tracking-tighter italic text-white/90">EARN<span class="text-yellow-300">MASTER</span></h1>
            <div class="bg-white/20 p-2 rounded-full"><i class="fa-solid fa-user-shield"></i></div>
        </div>
        <div class="text-center">
            <p class="text-[10px] text-white/70 uppercase font-black tracking-[3px] mb-2">Wallet Balance</p>
            <h2 class="text-6xl font-black tracking-tight">₹<span id="userBal">0.00</span></h2>
            <button onclick="showPage('withdraw')" class="mt-8 bg-white text-indigo-600 px-10 py-3 rounded-2xl font-black shadow-xl active:scale-95 transition-all text-sm uppercase">Withdraw Money</button>
        </div>
    </header>

    <!-- Main Screens -->
    <main class="p-5" id="main-content">
        <!-- Dashboard Card -->
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100 -mt-10 relative z-10 mb-6">
            <h3 class="font-black text-gray-800 text-sm mb-4"><i class="fa-solid fa-calendar-check text-orange-500 mr-2"></i>7-Day Bonus Streak</h3>
            <div class="grid grid-cols-7 gap-2 mb-4" id="streakGrid"></div>
            <button onclick="claimCheckin()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-orange-200 active:scale-95 transition-all">Claim Daily Bonus</button>
        </div>

        <div class="space-y-4" id="taskList">
            <!-- Tasks dynamically loaded from Admin -->
        </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white/90 backdrop-blur-md border-t p-4 flex justify-around rounded-t-[2.5rem] shadow-2xl">
        <button onclick="location.reload()" class="text-indigo-600 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-house-chimney text-xl"></i>Home</button>
        <button onclick="showPage('wallet')" class="text-gray-400 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-wallet text-xl"></i>Wallet</button>
        <button onclick="showPage('legal')" class="text-gray-400 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-shield-halved text-xl"></i>Privacy</button>
    </nav>

    <script>
        const backendUrl = "PASTE_YOUR_RENDER_URL_HERE"; 
        
        // Custom Toast Function
        function showToast(msg, icon = "✨") {
            const toast = document.getElementById('customToast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = icon;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function init() {
            const res = await fetch(`${backendUrl}/api/settings`);
            const s = await res.json();
            // Streak Logic
            const grid = document.getElementById('streakGrid');
            s.checkInRewards.forEach((r, i) => {
                grid.innerHTML += `<div class="aspect-square bg-slate-50 border rounded-xl flex flex-col items-center justify-center text-[8px] font-bold">
                    <span class="text-gray-400 uppercase">Day ${i+1}</span>
                    <span class="text-indigo-600">₹${r}</span>
                </div>`;
            });
            showToast("Welcome to EarnMaster Pro!");
        }

        async function claimCheckin() {
            const userId = localStorage.getItem('userId');
            const res = await fetch(`${backendUrl}/api/earn/checkin`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId })
            });
            const data = await res.json();
            if(res.ok) {
                showToast(data.msg, "🎁");
                document.getElementById('userBal').innerText = data.balance.toFixed(2);
            } else {
                showToast(data.msg, "⚠️");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
