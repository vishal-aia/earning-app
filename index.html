<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ADVANCED SEO -->
    <title>EarnMaster - Rozana Ads Dekhein aur Paise Kamayein</title>
    <meta name="description" content="EarnMaster par daily check-in karein, ads dekhein aur real cash kamayein. Sabse asaan aur 100% working earning platform.">
    <meta name="keywords" content="online earning, ghar baithe paise kamayein, watch ads earn money, daily rewards app">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://apki-site.vercel.app/">
    
    <!-- Open Graph (WhatsApp/FB Sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="EarnMaster - Rozana ₹500 tak kamayein">
    <meta property="og:description" content="Join karein aur aaj hi apni earning shuru karein. 100% Trusted.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2331/2331941.png">

    <!-- PWA & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .reward-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Top Navigation -->
    <nav class="bg-indigo-600 p-4 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-extrabold tracking-tighter">EARNMASTER</h1>
            <div class="bg-indigo-500 border border-indigo-400 px-4 py-1 rounded-full shadow-inner">
                <span class="text-xs">Wallet:</span> <span class="font-bold" id="balance">₹0.00</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 pb-24">
        
        <!-- Welcome Section -->
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-[2rem] text-white shadow-2xl mb-6 relative overflow-hidden">
            <div class="relative z-10">
                <p class="opacity-80">Namaste, User!</p>
                <h2 class="text-xl font-bold">Aaj ki kamayi shuru karein?</h2>
            </div>
            <div class="absolute -right-5 -bottom-5 text-9xl opacity-10">💰</div>
        </div>

        <!-- Tasks Grid -->
        <div class="grid gap-4">
            <!-- Task 1: Check-in -->
            <div onclick="doCheckIn()" class="reward-card bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer">
                <div class="bg-yellow-100 p-4 rounded-full text-2xl">🎁</div>
                <div class="flex-1">
                    <h3 class="font-bold">Daily Check-in</h3>
                    <p class="text-xs text-gray-500" id="checkin-text">Reward: Loading...</p>
                </div>
                <button class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-xl font-bold text-sm">CLAIM</button>
            </div>

            <!-- Task 2: Video Ads -->
            <div onclick="watchAd()" class="reward-card bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer">
                <div class="bg-blue-100 p-4 rounded-full text-2xl">📺</div>
                <div class="flex-1">
                    <h3 class="font-bold">Watch Video Ads</h3>
                    <p class="text-xs text-gray-500">Unlimited Earning</p>
                </div>
                <button class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm">WATCH</button>
            </div>
        </div>

        <!-- Withdrawal Info -->
        <div class="mt-8 text-center bg-gray-100 p-4 rounded-xl border-dashed border-2 border-gray-300">
            <p class="text-sm text-gray-600">Minimum Withdrawal: <span class="font-bold text-indigo-600" id="min-draw">₹100</span></p>
        </div>
    </main>

    <!-- Bottom Menu -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button class="text-indigo-600 flex flex-col items-center text-xs font-bold"><span>🏠</span>Home</button>
        <button onclick="alert('Coming Soon')" class="text-gray-400 flex flex-col items-center text-xs font-bold"><span>👥</span>Invite</button>
        <button onclick="alert('Coming Soon')" class="text-gray-400 flex flex-col items-center text-xs font-bold"><span>💳</span>Withdraw</button>
    </div>

    <script>
        let backendUrl = "https://earn-hub-z1su.onrender.com"; // Isko badleinge deployment ke baad
        
        async function loadSettings() {
            try {
                const res = await fetch(`${backendUrl}/api/settings`);
                const data = await res.json();
                document.getElementById('checkin-text').innerText = `Reward: ₹${data.checkInReward}`;
                document.getElementById('min-draw').innerText = `₹${data.minWithdraw}`;
                window.adLink = data.adLink;
            } catch(e) { console.log("Backend not connected yet"); }
        }

        function watchAd() {
            if(window.adLink) window.open(window.adLink, '_blank');
            else alert("Ad not ready. Admin se link mangwayein.");
        }

        function doCheckIn() {
            alert("Reward claimed! (Backend connect hote hi balance update hoga)");
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
