<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <h1 class="text-3xl font-bold mb-6 text-yellow-400">Master Control Panel</h1>

    <!-- Reward Settings Section -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-6">
        <h2 class="text-xl mb-4 text-blue-300 font-bold">Manage Rewards (Paise Badlein)</h2>
        <div class="space-y-4">
            <div>
                <label>Daily Check-in Reward (₹)</label>
                <input id="checkin" type="number" class="w-full bg-gray-700 p-3 rounded mt-1 border border-gray-600">
            </div>
            <div>
                <label>Adsterra Smartlink / Video Ad URL</label>
                <input id="adlink" type="text" class="w-full bg-gray-700 p-3 rounded mt-1 border border-gray-600">
            </div>
            <div>
                <label>Minimum Withdrawal Limit (₹)</label>
                <input id="minWithdraw" type="number" class="w-full bg-gray-700 p-3 rounded mt-1 border border-gray-600">
            </div>
            <button onclick="updateSettings()" class="w-full bg-green-600 hover:bg-green-700 p-4 rounded-lg font-bold text-lg">Update All Settings</button>
        </div>
    </div>

    <!-- User Management Section -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
        <h2 class="text-xl mb-4 text-purple-300 font-bold">User Database</h2>
        <div id="userList" class="space-y-2">
            <!-- Yahan Users ki list dikhegi -->
        </div>
    </div>

    <script>
        let backendUrl = "APKA_RENDER_BACKEND_URL"; // Ye hum deploy ke baad dalenge

        async function updateSettings() {
            const data = {
                checkInReward: document.getElementById('checkin').value,
                adLink: document.getElementById('adlink').value,
                minWithdraw: document.getElementById('minWithdraw').value
            };
            const res = await fetch(`${backendUrl}/api/admin/update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) alert("Admin Settings Updated Successfully!");
        }

        // Users ko load karne ka logic yahan aayega
    </script>
</body>
</html>
