<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER CONTROL - Private</title>
    <!-- SEO SAFETY: Google isey index nahi karega -->
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-4">
    <div class="max-w-lg mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-black text-yellow-400 tracking-tighter">ADMIN PANEL</h1>
            <p class="text-gray-500 text-sm italic">Yahan se puri website control karein</p>
        </header>

        <section class="bg-gray-800 p-6 rounded-3xl shadow-xl border border-gray-700">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-1">Check-in Reward (₹)</label>
                    <input id="checkin" type="number" placeholder="Eg: 2" class="w-full bg-gray-700 p-4 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-1">Ad Link (Adsterra/Monetag)</label>
                    <input id="adlink" type="text" placeholder="https://..." class="w-full bg-gray-700 p-4 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-1">Minimum Withdraw (₹)</label>
                    <input id="minWithdraw" type="number" placeholder="Eg: 200" class="w-full bg-gray-700 p-4 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400">
                </div>
                <button onclick="saveAdmin()" class="w-full bg-yellow-400 text-gray-900 font-black p-5 rounded-2xl hover:bg-yellow-300 transition-colors shadow-lg">
                    APPLY CHANGES TO ALL USERS
                </button>
            </div>
        </section>
    </div>

    <script>
        let backendUrl = "https://apki-site-backend.onrender.com"; // Render URL yahan aayega

        async function saveAdmin() {
            const data = {
                checkInReward: document.getElementById('checkin').value,
                adLink: document.getElementById('adlink').value,
                minWithdraw: document.getElementById('minWithdraw').value
            };
            
            const response = await fetch(`${backendUrl}/api/admin/update`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(response.ok) alert("✅ Settings Update ho gayi hain!");
            else alert("❌ Error: Backend connect nahi hai.");
        }
    </script>
</body>
</html>
