<!-- Iska code thoda bada hoga isliye main isme main functionality de raha hoon -->
<div class="p-6 bg-gray-900 min-h-screen text-white">
    <h1 class="text-2xl font-bold text-yellow-500 mb-6">PRO ADMIN CONTROL</h1>
    
    <div class="bg-gray-800 p-4 rounded-xl mb-4">
        <label>7-Day Rewards (Comma separated)</label>
        <input id="checkin-array" type="text" value="1,2,3,4,5,10,20" class="w-full p-3 bg-gray-700 rounded mt-2">
        <p class="text-[10px] text-gray-400 mt-1">Example: Day1 reward is 1, Day2 is 2...</p>
    </div>

    <div class="bg-gray-800 p-4 rounded-xl mb-4">
        <label>Task Timer (Seconds)</label>
        <input id="timer" type="number" value="30" class="w-full p-3 bg-gray-700 rounded mt-2">
    </div>

    <button onclick="updateSettings()" class="w-full bg-green-600 p-4 rounded-xl font-bold">UPDATE SETTINGS</button>
</div>
