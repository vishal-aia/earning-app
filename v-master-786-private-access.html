<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Master Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8">

    <!-- LOGIN SCREEN -->
    <div id="login" class="fixed inset-0 bg-black flex items-center justify-center z-[999]">
        <div class="bg-slate-900 p-10 rounded-[3rem] border border-slate-800 text-center w-80">
            <h2 class="text-2xl font-black mb-8 text-indigo-500 tracking-tighter uppercase">Admin Login</h2>
            <input id="pin" type="password" placeholder="PIN" class="w-full bg-black border border-slate-700 p-5 rounded-2xl text-center text-3xl font-bold mb-6">
            <button onclick="checkPin()" class="w-full bg-indigo-600 p-5 rounded-2xl font-black shadow-xl shadow-indigo-900/20">ACCESS</button>
        </div>
    </div>

    <!-- MAIN PANEL -->
    <div id="panel" class="hidden max-w-5xl mx-auto space-y-10">
        <h1 class="text-4xl font-black italic text-white uppercase tracking-tighter">System Control Center</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Task Manager -->
            <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800 space-y-6">
                <h2 class="text-xl font-bold">Add New Task</h2>
                <input id="tTitle" type="text" placeholder="Task Title" class="w-full bg-black p-4 rounded-xl">
                <input id="tLink" type="text" placeholder="Adsterra/Smartlink Link" class="w-full bg-black p-4 rounded-xl">
                <input id="tReward" type="number" placeholder="Reward ₹" class="w-full bg-black p-4 rounded-xl">
                <button onclick="addTask()" class="w-full bg-indigo-600 p-4 rounded-xl font-bold">DEPLOY TASK</button>
            </div>

            <!-- Global Settings -->
            <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800 space-y-6">
                <h2 class="text-xl font-bold">Global Settings</h2>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase">7-Day Check-in Rewards</label>
                    <input id="rewards" type="text" value="1,2,3,5,10,15,30" class="w-full bg-black mt-2 p-4 rounded-xl">
                </div>
                <button onclick="saveSettings()" class="w-full bg-green-600 p-4 rounded-xl font-bold">UPDATE SETTINGS</button>
            </div>
        </div>

        <!-- Withdraw List -->
        <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800">
            <h2 class="text-xl font-bold mb-6 italic">Withdrawal Manager</h2>
            <div id="wList" class="space-y-4">
                <p class="text-xs text-gray-500">Fetching requests...</p>
            </div>
        </div>
    </div>

    <script>
        const MASTER_PIN = "2412"; // 🛑 CHANGE THIS PIN
        const backendUrl = "https://earn-hub-z1su.onrender.com"; 

        function checkPin() {
            if(document.getElementById('pin').value === MASTER_PIN) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').classList.remove('hidden');
                loadStats();
            }
        }

        async function saveSettings() {
            const data = {
                checkInRewards: document.getElementById('rewards').value.split(',').map(Number)
            };
            await fetch(`${backendUrl}/api/admin/update-settings`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert("✅ Settings Synchronized!");
        }

        async function addTask() {
            const data = {
                title: document.getElementById('tTitle').value,
                link: document.getElementById('tLink').value,
                reward: document.getElementById('tReward').value
            };
            await fetch(`${backendUrl}/api/admin/add-task`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert("✅ Task Added!");
        }
    </script>
</body>
</html>
