<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Earning Hub | Master Control</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8">

    <div id="login" class="fixed inset-0 bg-black flex items-center justify-center z-[999]">
        <div class="bg-slate-900 p-10 rounded-[3rem] border border-slate-800 text-center w-80 shadow-2xl">
            <h2 class="text-2xl font-black mb-8 text-amber-400">ADMIN LOGIN</h2>
            <input id="pin" type="password" maxlength="6" placeholder="••••••" class="w-full bg-black border border-slate-700 p-5 rounded-2xl text-center text-3xl font-bold mb-6 tracking-[10px]">
            <button onclick="checkPin()" class="w-full bg-amber-400 text-black p-5 rounded-2xl font-black">ACCESS PANEL</button>
        </div>
    </div>

    <div id="panel" class="hidden max-w-6xl mx-auto space-y-10">
        <div class="flex justify-between items-center">
            <h1 class="text-4xl font-black italic">EARNING HUB <span class="text-amber-500">MASTER</span></h1>
            <div class="bg-slate-900 p-4 rounded-2xl text-xs text-blue-400 border border-slate-800">
                URL: https://earn-hub-z1su.onrender.com
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800">
                <p class="text-[10px] text-slate-500 font-bold uppercase mb-2">Total Users</p>
                <h3 id="uCount" class="text-3xl font-black">0</h3>
            </div>
            <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800">
                <p class="text-[10px] text-slate-500 font-bold uppercase mb-2">Pending Withdrawals</p>
                <h3 id="wCount" class="text-3xl font-black text-orange-500 font-black">0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800 space-y-6">
                <h2 class="text-xl font-bold italic">Deploy New Task</h2>
                <input id="tTitle" type="text" placeholder="Task Name" class="w-full bg-black p-4 rounded-xl">
                <input id="tReward" type="number" placeholder="Reward ₹" class="w-full bg-black p-4 rounded-xl">
                <input id="tLink" type="text" placeholder="Adsterra/App Link" class="w-full bg-black p-4 rounded-xl">
                <button onclick="addTask()" class="w-full bg-amber-400 text-black p-4 rounded-xl font-black">DEPLOY TASK</button>
            </div>

            <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800 space-y-6">
                <h2 class="text-xl font-bold italic">Manage Payouts</h2>
                <div id="withdrawList" class="space-y-4 text-xs">
                    <!-- List items -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const MASTER_PIN = "241204"; 
        const backendUrl = "https://earn-hub-z1su.onrender.com";

        function checkPin() {
            if(document.getElementById('pin').value === MASTER_PIN) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').classList.remove('hidden');
                loadStats();
            }
        }

        async function loadStats() {
            const res = await fetch(`${backendUrl}/api/admin/stats`);
            const d = await res.json();
            document.getElementById('uCount').innerText = d.totalUsers;
            document.getElementById('wCount').innerText = d.pendingWithdraws.length;
        }

        async function addTask() {
            // Logic to send task to backend
            alert("Task Deployed!");
        }
    </script>
</body>
</html>
