<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Master Control</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <div id="login" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50">
        <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800 w-80 text-center">
            <h2 class="text-2xl font-black mb-6">ADMIN ACCESS</h2>
            <input id="pin" type="password" placeholder="SECRET PIN" class="w-full bg-black border border-slate-700 p-4 rounded-2xl text-center text-xl font-bold mb-4 outline-none focus:border-indigo-500">
            <button onclick="checkPin()" class="w-full bg-indigo-600 p-4 rounded-2xl font-black">UNSEAL PANEL</button>
        </div>
    </div>

    <div id="panel" class="hidden p-6 max-w-4xl mx-auto pb-24">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-white uppercase italic">Profit Center</h1>
                <p id="status" class="text-xs text-green-500 font-bold tracking-widest uppercase">System Online</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Total Users</p>
                <h3 id="userCount" class="text-3xl font-black">...</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Active Backend URL</p>
                <input id="url" type="text" class="w-full bg-black mt-2 p-2 text-[10px] rounded text-blue-400 border-none outline-none">
            </div>
        </div>

        <!-- REWARD EDITOR -->
        <div class="bg-slate-900 p-8 rounded-[3rem] border border-slate-800 space-y-6">
            <h2 class="text-xl font-bold border-b border-slate-800 pb-4">Reward Controller</h2>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Smartlink Payout (₹)</label>
                    <input id="slReward" type="number" step="0.1" class="w-full bg-black mt-2 p-4 rounded-2xl border border-slate-800 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Daily Cap per User (₹)</label>
                    <input id="cap" type="number" class="w-full bg-black mt-2 p-4 rounded-2xl border border-slate-800 outline-none">
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Adsterra / Monetag Link</label>
                <input id="ad" type="text" class="w-full bg-black mt-2 p-4 rounded-2xl border border-slate-800 outline-none">
            </div>
            <button onclick="deploy()" class="w-full bg-indigo-600 p-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-900/30">UPDATE ALL REWARDS INSTANTLY</button>
        </div>
    </div>

    <script>
        const SECRET_PIN = "7860"; // 🛑 APNA PASSWORD
        const backendUrl = "PASTE_YOUR_RENDER_URL_HERE"; 

        function checkPin() {
            if(document.getElementById('pin').value === SECRET_PIN) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').classList.remove('hidden');
                document.getElementById('url').value = backendUrl;
                load();
            }
        }

        async function load() {
            const res = await fetch(`${backendUrl}/api/admin/stats`);
            const d = await res.json();
            document.getElementById('userCount').innerText = d.totalUsers;
            document.getElementById('slReward').value = d.settings.smartlinkReward;
            document.getElementById('cap').value = d.settings.dailyCap;
            document.getElementById('ad').value = d.settings.adLink;
        }

        async function deploy() {
            const data = {
                smartlinkReward: document.getElementById('slReward').value,
                dailyCap: document.getElementById('cap').value,
                adLink: document.getElementById('ad').value
            };
            const res = await fetch(`${backendUrl}/api/admin/update-settings`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) alert("✅ MISSION SUCCESS: All user rewards updated.");
        }
    </script>
</body>
</html>
